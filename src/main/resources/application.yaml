spring:
  application:
    name: ArenaRanking2
datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/arena_ranking}
  username: arena
  password: arena

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

